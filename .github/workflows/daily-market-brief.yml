name: Daily Market Brief

# v4.x Six Daily Report Schedule & Reliability Upgrade
# JST（Asia/Tokyo）で1日6回、レポートを自動生成する。GitHub Actions の schedule cron は
# UTC 基準のため、レポート日付・保存日付・slot 判定はすべて Python 側（main.py /
# scripts/resolve_report_schedule.py）で JST へ変換して行う（cron の時刻から JST 日付を
# 推測しない）。
#
# 通常実行（6回）と、その15分後の欠損回復チェック（6回）を同じ workflow で mode 分岐する。
# 回復チェックは対象 slot が success のとき何も生成せず正常終了する（--recovery）。
#
#   通常  07:30 JST = 22:30 UTC / 09:10 = 00:10 / 11:30 = 02:30 / 12:40 = 03:40 / 15:40 = 06:40 / 17:20 = 08:20
#   回復  07:45 JST = 22:45 UTC / 09:25 = 00:25 / 11:45 = 02:45 / 12:55 = 03:55 / 15:55 = 06:55 / 17:35 = 08:35
#
# 既存の手動実行（workflow_dispatch）と Cloudflare Worker のワンタップ実行（inputs なしの
# dispatch）は維持する。inputs はすべて default 値を持つため、inputs 無しの dispatch でも壊れない。
#
# GitHub Pages を使うには、リポジトリの Settings > Pages > Build and deployment >
# Source を「GitHub Actions」に設定してください（一度だけの手動設定）。

on:
  schedule:
    # --- 通常実行（6回・UTC） ---
    - cron: "30 22 * * *"   # 07:30 JST 寄り前
    - cron: "10 0 * * *"    # 09:10 JST 寄り付き
    - cron: "30 2 * * *"    # 11:30 JST 前場終了
    - cron: "40 3 * * *"    # 12:40 JST 後場開始
    - cron: "40 6 * * *"    # 15:40 JST 大引け
    - cron: "20 8 * * *"    # 17:20 JST 夕方総括
    # --- 欠損回復チェック（各15分後・UTC。successならno-op） ---
    - cron: "45 22 * * *"   # 07:45 JST 回復
    - cron: "25 0 * * *"    # 09:25 JST 回復
    - cron: "45 2 * * *"    # 11:45 JST 回復
    - cron: "55 3 * * *"    # 12:55 JST 回復
    - cron: "55 6 * * *"    # 15:55 JST 回復
    - cron: "35 8 * * *"    # 17:35 JST 回復
  workflow_dispatch:
    inputs:
      report_slot:
        description: "生成するレポートスロット"
        required: false
        type: choice
        options:
          - auto
          - pre_market
          - market_open
          - morning_close
          - afternoon_open
          - market_close
          - evening
        default: auto
      force:
        description: "生成済みでも再生成"
        required: false
        type: boolean
        default: false
      recovery:
        description: "欠損回復モード（missing/failed/staleのみ生成）"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write
  # v4.76 P4-3b2c: producer artifact の cross-run 参照・取得に必要な最小権限のみ追加。
  # 他の権限は一切広げない（write 系の追加はゼロ）。
  actions: read

# 1日最大12回（通常6＋回復6）の実行が同時多発しても commit/push 競合を避けるため直列化する。
# schedule イベントでは inputs が存在しないため、event.schedule（cron文字列）を group に使う。
# workflow_dispatch では report_slot を使う。どちらでも安全に評価できる式にしている。
# cancel-in-progress は false（生成途中を打ち切らない）。
concurrency:
  group: daily-market-brief-${{ github.ref }}-${{ github.event.inputs.report_slot || github.event.schedule || 'manual' }}
  cancel-in-progress: false

jobs:
  generate-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # v4.12 Stage 1.7（承認事項D）: Security Guard。機密ファイル（羅針盤PDF等の
      # CONFIDENTIAL_SOURCE・SENSITIVE_IDENTIFIER）が誤ってGit trackingされた場合、
      # レポート生成前にworkflowを失敗させる（docs/security/DATA_CLASSIFICATION_POLICY.md）。
      - name: Security guard (confidential tracking check)
        run: python -m pytest tests/intelligence/test_confidential_guard.py -q

      # cron 文字列 / dispatch 入力から (slot_id, mode, trigger_type, force, recovery) を解決する。
      - name: Resolve report slot
        id: sched
        env:
          EVENT_NAME: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
          INPUT_REPORT_SLOT: ${{ github.event.inputs.report_slot }}
          INPUT_FORCE: ${{ github.event.inputs.force }}
          INPUT_RECOVERY: ${{ github.event.inputs.recovery }}
          CONFIG_PATH: config.yaml
        run: python scripts/resolve_report_schedule.py

      - name: Generate market brief
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TO: ${{ secrets.LINE_TO }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
          # v4.6 Rashinban Private Insight Vault: 派生情報取得用（未設定なら機能は無効のまま）
          INSIGHT_API_TOKEN: ${{ secrets.INSIGHT_API_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
          SLOT_ID: ${{ steps.sched.outputs.slot_id }}
          TRIGGER_TYPE: ${{ steps.sched.outputs.trigger_type }}
          FORCE_FLAG: ${{ steps.sched.outputs.force }}
          RECOVERY_FLAG: ${{ steps.sched.outputs.recovery }}
        # Python 側で最大2回まで自動再試行する（config: max_retry_count）。
        # ネットワーク取得エラーは個別に「取得不可」で握りつぶすため、ここで失敗するのは
        # HTML生成そのものが致命的に壊れた場合など。最終失敗時のみ workflow を失敗扱いにする。
        run: |
          set -o pipefail
          ARGS="--report-slot ${SLOT_ID} --trigger-type ${TRIGGER_TYPE}"
          if [ "${FORCE_FLAG}" = "true" ]; then ARGS="${ARGS} --force"; fi
          if [ "${RECOVERY_FLAG}" = "true" ]; then ARGS="${ARGS} --recovery"; fi
          MAX_RETRY=2
          WAIT=120
          attempt=0
          until python main.py ${ARGS}; do
            attempt=$((attempt+1))
            if [ "${attempt}" -gt "${MAX_RETRY}" ]; then
              echo "::error::main.py が ${MAX_RETRY} 回の再試行後も失敗しました。"
              exit 1
            fi
            echo "::warning::main.py 実行に失敗しました。${WAIT}s 後に再試行します（${attempt}/${MAX_RETRY}）。"
            sleep "${WAIT}"
          done

      - name: Commit and push report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 自動生成ファイルのみをコミット対象にする。
          git add output/*.md output/*.html 2>/dev/null || true
          # v4.x: 各スロットの履歴HTMLと実行記録JSONを永続化（存在する場合のみ）。
          git add output/history 2>/dev/null || true
          git add data/report_runs 2>/dev/null || true
          # 学習データ・翻訳キャッシュ（従来どおり）。
          git add data/investment_journal/journal.json data/theme_learning/theme_learning.json data/translation_cache/translation_cache.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "変更がないためコミットをスキップします。"
          else
            git commit -m "Add daily market brief (${SLOT_ID:-adhoc})"
            # 同時実行との競合に備え、push 直前に最新 main を rebase 取得してから push（force push はしない）。
            for i in 1 2 3 4 5; do
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && break
              echo "push 競合またはネットワークエラー。${i} 回目の再試行をします..."
              sleep $((i*3))
            done
          fi
        env:
          SLOT_ID: ${{ steps.sched.outputs.slot_id }}
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Prepare GitHub Pages site
        run: |
          mkdir -p pages-site
          cp output/latest_market_brief.html pages-site/index.html
          # 履歴もPagesへ同梱（HTMLの「本日の過去レポート」リンクが history/ を参照するため）。
          if [ -d output/history ]; then
            mkdir -p pages-site/history
            cp -r output/history/* pages-site/history/ 2>/dev/null || true
          fi

      # ------------------------------------------------------------------
      # v4.76 P4-3b2c: Morning Delivery `/v2` 並走公開（OPTION A）。
      #
      # Pages deployment は **whole-site 置換**であるため、`/v2` だけを deploy する
      # 経路は作れない（legacy root が消える）。よって既存の単一 Pages deployment を
      # そのまま使い、`upload-pages-artifact` の**直前**に `/v2` を接ぎ木する。
      # **2 本目の Pages writer / deployer は作らない。**
      #
      # legacy 配信を守るため、`/v2` の取得・検証は pages-site を**一切触らずに**行い、
      # 期待された失敗（材料が無い / 古い / b2a が拒否）は typed result として
      # safe-skip する。pages-site へ書き込むのは graft step だけで、その後の検証は
      # 厳格（失敗＝ LEGACY_FAILURE ＝ deploy させない）。
      # 公開内容の権威は凍結 P4-3b2a のままで、ここでは再検証も複製もしない。
      # ------------------------------------------------------------------

      # 接ぎ木前の legacy tree を byte 単位で記録する（この step は厳格）。
      - name: Capture the legacy Pages manifest before /v2
        id: p43b2c_before
        run: |
          set -euo pipefail
          python -X utf8 scripts/p43b2c_pages_manifest.py build \
            --root pages-site \
            --output "${RUNNER_TEMP}/p43b2c_manifest_before.json"
          # 凍結 Compass pilot と同一の導出（runner の UTC 日付をそのまま使わない）。
          echo "jst_today=$(python -c 'from datetime import datetime, timedelta, timezone; print((datetime.now(timezone.utc) + timedelta(hours=9)).date().isoformat())')" >> "$GITHUB_OUTPUT"
          echo "now_utc=$(python -c 'from datetime import datetime, timezone; print(datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"))')" >> "$GITHUB_OUTPUT"

      # 本番契約で producer artifact を選ぶ。期待された失敗では exit 0 し、
      # 分類は result に出る（legacy 配信を落とさない）。
      # **TRUST_BASELINE は promotion 時に main 上の承認済み producer commit を入れる。**
      # 空のままなら production mode は CONFIGURATION_INVALID で fail closed し、
      # legacy だけが publish される（＝ promotion 前の意図した状態）。
      - name: Select a trusted producer artifact for /v2
        id: p43b2c_select
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          P43B2C_TRUST_BASELINE: ""
        run: |
          set -uo pipefail
          set +e
          python -X utf8 scripts/p43b2c_select_producer.py \
            --mode production \
            --producer-branch main \
            --trust-baseline "${P43B2C_TRUST_BASELINE}" \
            --eligible-events push,workflow_dispatch \
            --attempt-policy first-attempt-only
          rc=$?
          set -e
          if [ "${rc}" -ne 0 ]; then
            echo "result=V2_INTERNAL_ERROR" >> "$GITHUB_OUTPUT"
            echo "reason_code=SELECTOR_CRASHED" >> "$GITHUB_OUTPUT"
            echo "::warning::/v2 selector exited ${rc}; publishing the legacy site only."
          fi

      # 選定できたときだけ取得する。取得失敗は legacy 配信を落とさず、
      # 次 step が outcome を見て typed result へ落とす（blanket な握り潰しはしない）。
      - name: Download the selected producer artifact
        id: p43b2c_download
        if: steps.p43b2c_select.outputs.result == 'SELECTED'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.p43b2c_select.outputs.artifact_id }}
          run-id: ${{ steps.p43b2c_select.outputs.selected_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/p43b2c_download

      # 展開形の確認 → 凍結 b2a で隔離組み立て → 鮮度判定。**pages-site には触れない。**
      # b2a の staging は destination.parent へ作られるため、宛先を pages-site/v2 には
      # しない（残骸が公開されうる）。runner.temp の隔離 staging root を使う。
      - name: Validate and stage /v2 outside the pages site
        id: p43b2c_stage
        if: steps.p43b2c_select.outputs.result == 'SELECTED'
        env:
          ARTIFACT_NAME: ${{ steps.p43b2c_select.outputs.artifact_name }}
          ARTIFACT_CREATED_AT: ${{ steps.p43b2c_select.outputs.artifact_created_at }}
          DOWNLOAD_OUTCOME: ${{ steps.p43b2c_download.outcome }}
          JST_TODAY: ${{ steps.p43b2c_before.outputs.jst_today }}
          NOW_UTC: ${{ steps.p43b2c_before.outputs.now_utc }}
        run: |
          set -uo pipefail
          stage="${RUNNER_TEMP}/p43b2c_stage"
          mkdir -p "${stage}"
          if [ "${DOWNLOAD_OUTCOME}" != "success" ]; then
            echo "result=V2_INTERNAL_ERROR" >> "$GITHUB_OUTPUT"
            echo "reason_code=DOWNLOAD_FAILED" >> "$GITHUB_OUTPUT"
            echo "::warning::/v2 artifact download did not succeed; publishing the legacy site only."
            exit 0
          fi
          set +e
          python -X utf8 - <<'PY' > "${stage}/wrapper.txt" 2>&1
          import os, pathlib, sys
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "p43b2c_download"
          expected = os.environ["ARTIFACT_NAME"]
          entries = sorted(p.name for p in root.iterdir()) if root.is_dir() else []
          problems = []
          if not expected or "/" in expected or expected in (".", ".."):
              problems.append("selector did not provide a usable artifact name")
          elif not root.is_dir():
              problems.append("download root does not exist")
          elif len(entries) != 1:
              problems.append(f"download root must hold exactly 1 entry, found {len(entries)}")
          elif entries[0] != expected:
              problems.append("download root entry is not the selected artifact name")
          elif not (root / expected).is_dir():
              problems.append("the expected wrapper entry is not a directory")
          print(f"p43b2c download root entry names: {entries}")
          for problem in problems:
              print(f"wrapper shape rejected: {problem}")
          sys.exit(1 if problems else 0)
          PY
          wrapper_rc=$?
          cat "${stage}/wrapper.txt"
          if [ "${wrapper_rc}" -ne 0 ]; then
            echo "result=V2_REJECTED" >> "$GITHUB_OUTPUT"
            echo "reason_code=WRAPPER_SHAPE" >> "$GITHUB_OUTPUT"
            echo "::warning::/v2 artifact wrapper shape was rejected; publishing the legacy site only."
            exit 0
          fi
          python -X utf8 -m src.intelligence.reports.pages_parallel \
            --artifact-dir "${RUNNER_TEMP}/p43b2c_download/${ARTIFACT_NAME}" \
            --v2-destination "${stage}/v2" \
            --jst-today "${JST_TODAY}" \
            --index-template docs/pages/v2_index.html > "${stage}/b2a.txt" 2>&1
          cat "${stage}/b2a.txt"
          printf '{"artifact_created_at": "%s"}\n' "${ARTIFACT_CREATED_AT}" > "${stage}/selection.json"
          python -X utf8 scripts/p43b2c_v2_gate.py \
            --selection "${stage}/selection.json" \
            --b2a-output "${stage}/b2a.txt" \
            --now-utc "${NOW_UTC}" \
            --jst-today "${JST_TODAY}" \
            --output "${stage}/gate.json"
          set -e
          result="$(python -X utf8 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["result"])' "${stage}/gate.json")"
          reason="$(python -X utf8 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["reason_code"])' "${stage}/gate.json")"
          echo "result=${result}" >> "$GITHUB_OUTPUT"
          echo "reason_code=${reason}" >> "$GITHUB_OUTPUT"
          if [ "${result}" != "PASS" ]; then
            echo "::warning::/v2 was not published (${result} / ${reason}); publishing the legacy site only."
          fi

      # **pages-site へ書き込む唯一の step。** ここから先の失敗は致命（deploy させない）。
      - name: Graft the validated /v2 into the pages site
        if: steps.p43b2c_stage.outputs.result == 'PASS'
        run: |
          set -euo pipefail
          python -X utf8 scripts/p43b2c_graft_v2.py \
            --staging-v2 "${RUNNER_TEMP}/p43b2c_stage/v2" \
            --pages-site pages-site \
            --gate "${RUNNER_TEMP}/p43b2c_stage/gate.json" \
            --output "${RUNNER_TEMP}/p43b2c_grafted.json"

      # legacy が 1 byte も変わっていないこと・/v2 の形・tree 衛生を実測する。
      # `/v2` の採否に関わらず必ず走り、失敗すれば deploy へ進ませない。
      - name: Verify the legacy Pages tree is unchanged
        run: |
          set -euo pipefail
          if [ "${{ steps.p43b2c_stage.outputs.result }}" = "PASS" ]; then
            python -X utf8 scripts/p43b2c_pages_manifest.py verify \
              --root pages-site \
              --before "${RUNNER_TEMP}/p43b2c_manifest_before.json" \
              --expect-v2 present \
              --grafted "${RUNNER_TEMP}/p43b2c_grafted.json"
          else
            python -X utf8 scripts/p43b2c_pages_manifest.py verify \
              --root pages-site \
              --before "${RUNNER_TEMP}/p43b2c_manifest_before.json" \
              --expect-v2 absent
          fi
          python -X utf8 scripts/p43b2c_pages_manifest.py hygiene --root pages-site

      # 採否とその理由を job summary へ残す（秘密値・絶対 path は出さない）。
      - name: Record the /v2 publication status
        if: always()
        env:
          SELECT_RESULT: ${{ steps.p43b2c_select.outputs.result }}
          SELECT_REASON: ${{ steps.p43b2c_select.outputs.reason_code }}
          STAGE_RESULT: ${{ steps.p43b2c_stage.outputs.result }}
          STAGE_REASON: ${{ steps.p43b2c_stage.outputs.reason_code }}
        run: |
          {
            echo "### Morning Delivery /v2 並走公開（P4-3b2c beta）"
            echo ""
            echo "- 選定: ${SELECT_RESULT:-SKIPPED} (${SELECT_REASON:-none})"
            echo "- 公開判定: ${STAGE_RESULT:-SKIPPED} (${STAGE_REASON:-none})"
            if [ "${STAGE_RESULT:-}" = "PASS" ]; then
              echo "- ✅ /v2 を今回の Pages artifact へ含めました"
            else
              echo "- ⏭️ /v2 は今回含めていません（legacy の配信は通常どおり継続）"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-site

      - name: Write job summary
        if: always()
        env:
          SLOT_ID: ${{ steps.sched.outputs.slot_id }}
          MODE: ${{ steps.sched.outputs.mode }}
          TRIGGER_TYPE: ${{ steps.sched.outputs.trigger_type }}
        run: |
          {
            echo "### Daily Market Brief 実行結果"
            echo ""
            echo "- スロット: ${SLOT_ID:-adhoc}（mode=${MODE:-generate} / trigger=${TRIGGER_TYPE:-unknown}）"
            if [ -f output/latest_market_brief.html ]; then
              echo "- ✅ latest_market_brief.html 生成"
            else
              echo "- ❌ latest_market_brief.html が見つかりません"
            fi
            echo ""
            echo "個別の情報源の取得失敗はレポート内で「取得不可」と表示され、処理全体は失敗しない設計です。"
            echo "回復チェック実行（--recovery）は対象スロットが success の場合、何も生成せず正常終了します。"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-pages:
    needs: generate-report
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
