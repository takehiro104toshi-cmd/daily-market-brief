# =============================================================================
# Entity Catalog（Phase 2-E PART: ENTITY CATALOG / versioned knowledge asset）
# =============================================================================
# 原則: FALSE ENTITY LINK IS WORSE THAN MISSED ENTITY LINK（高precision優先）
#
# - 対象: 現在の歴史コーパス3,056記事＋Compass対象（config.yaml watchlist）に
#   必要な主要企業・国・中央銀行・指数・コモディティ・通貨。**巨大な全世界DBを作らない**。
# - alias安全度の3段階:
#     aliases_safe    … 単独マッチ許可（一般語衝突がない表記。case-sensitive）
#     aliases_context … **文脈必須**alias（Apple/Meta/Amazon等の一般語衝突対策。
#                       context_termsのいずれかが同一テキスト内に共起した場合のみlink）
#     ticker          … 単独の大文字語としては**絶対にマッチさせない**
#                       （$NVDA / NASDAQ:NVDA / (7203.T) 等の明示記法のみ。
#                       AI/IT/US/CAT等の一般大文字語の誤linkを構造的に排除）
# - country/sector はentityの**属性**（domicile・所属業種）であり、
#   記事の分類（subject country / article theme）とは別物（混同禁止）。
# - entity_idは "<kind>:<slug>" で安定。市場系列（market catalog）のinstrument_idと
#   揃えられるものは揃える（index:nikkei225等——bank横断の結線点）。

