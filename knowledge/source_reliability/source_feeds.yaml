# フィードカタログ（Canonical・v2.0.0）
# Stage 1.5（2026-08-29）でarticle-intelligence-data-tank `config/sources.yaml`（70ソース・
# 豊富なメタデータ: source_class/country/language/category/trust_score）を正として統合し、
# v1.0.0（daily-market-brief collectors由来24フィード）のうちtankに無い16フィードを追加した。
# 旧v1.0.0の由来・方針記録（reference_only/skipped）は下部に保持。
#
# verification:
#   verified     … tankの記事ストア実績で記事取得を確認済み（articles_observed参照。
#                  観測窓 2026-06-22..2026-07-22 の実測値）
#   unverified   … 実地未確認
#   likely_dead  … 提供終了が濃厚（Reuters agency feed）
#   dead         … 死活確認で到達不能と確定（Stage 2以降で設定）
# enabled: tank運用時の有効フラグ（falseはtank側で到達性未確認等の理由で無効化されていたもの）
# trust_score: 0-100（tank由来。dmb由来はreliability×100で換算）
# origin: tank / dmb / tank+dmb（両方に存在したもの）

