# フィードカタログ（Canonical・v3.0.0）
# Phase 1-B（2026-08-29）Source Registry & Health Auditの成果。生成: 決定表＋実測データ
# （tank記事ストア実測・Legacy CI 14日実測・collectors URL突合）から決定的に導出。
#
# 重要な区別: historical（tank実績=HISTORICALLY_OBSERVED）とcurrent_health（現在死活）は
# 別レイヤーで保持し、混同しない。過去に取れていたことは現在取れることを意味しない。
# current_healthは観測evidenceからの導出値（正）。Secret値・認証情報は一切記載しない。
id: source_reliability.source_feeds
version: 3.0.0
description: '自動取得対象フィードのCanonicalカタログ（86ソース）。Phase 1-B Source Registry & Health Auditで再構成: endpoint（取得口）/historical（tank実績）/recent_ci（Legacy
  CI実測）/current_health（現在死活の導出結果）/investment_value/role/duplicate_groupを分離保持'
source: v2.0.0（tank config/sources.yaml＋data/article_store実測＋dmb collectors）を基礎に、Legacy CI日次レポート実測（output/2026-08-16..29のデータ品質カード）とsrc/collectors・config.yamlのURL突合で現在死活を判定
status: active
evidence_layers:
  historical: tank記事ストア実測（観測窓 2026-06-22..2026-07-22）。過去実績であり現在正常の証明ではない
  recent_ci: Legacy日次レポートのデータ品質カード実測（2026-08-16..2026-08-29、14日分）。URL一致でカタログidへ対応付け
  live_check: 2026-08-29時点、開発環境のegress遮断（proxy 403）によりlive HTTPチェックは実行不能。src/intelligence/sources/health_check.py
    をネットワークのある環境で実行して補完する
vocabulary:
  current_health.state:
  - healthy
  - degraded
  - auth_required
  - rate_limited
  - moved
  - dead
  - unverified
  current_health.method:
  - live_http
  - legacy_ci_report
  - tank_shards
  - static_analysis
  - live_check_blocked
  investment_value:
  - MARKET_CRITICAL
  - HIGH
  - MEDIUM
  - LOW
  role:
  - CORE
  - SUPPORT
  - CONTEXT
  - DISABLE
  category:
  - primary_official
  - high_quality_secondary
  - general_secondary
  - market_data_provider
  - other
  endpoint.declared_format:
  - rss2
  - atom
  - rdf
  - json_api
  - html
  - unknown
  endpoint.auth_type:
  - none
  - api_key_header
  - api_key_query
  - bearer
  - other
  endpoint.usage_status:
  - public_feed
  - api_terms
  - restricted
  - unknown
