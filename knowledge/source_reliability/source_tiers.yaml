  - { name: "Reuters Business(見出し)",        reliability: 0.85, tier: 2, origin: "collectors/reuters.py RELIABILITY" }
  - { name: "WSJ Markets(見出し)",             reliability: 0.85, tier: 2, origin: "collectors/wsj.py RELIABILITY" }
  - { name: "CNBC",                            reliability: 0.80, tier: 2, origin: "collectors/cnbc.py RELIABILITY" }
  - { name: "ロイター(Yahoo!ニュース経由)",     reliability: 0.75, tier: 2, origin: "config/source_reliability" }
  - { name: "MarketWatch",                     reliability: 0.75, tier: 2, origin: "collectors/marketwatch.py RELIABILITY" }

  # --- tier 3: 一般ニュース・その他 ---
