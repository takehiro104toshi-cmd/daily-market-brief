# =============================================================================
# MarketSeries正式カタログ（Phase 2-D PART B / versioned config）
# =============================================================================
# 原則: A NUMBER WITHOUT IDENTITY AND CONTEXT IS NOT MARKET DATA
#
# - series_id は src/intelligence/databank/market_model.make_series_id の規約
#   （instrument_id.metric.observation_type[.session]）から決定論的に導出される。
#   loaderが照合し、不一致はカタログエラー（雑な同一視の混入を防ぐ）。
# - 指数現物・ETF・先物は**別instrument**（例: 日経平均指数 ≠ 1321 ETF ≠ 日経先物）。
#   先物継続足は instrument_id を futures:*_cont として明示する。
# - USDJPYの「終値」は複数存在する（spot連続取引のprovider日足 / 東京仲値fixing /
#   東京17時・NY17時クローズ）——本カタログはprovider日足closeを global セッションの
#   別系列として定義し、fixing等を追加する場合は**新series**として追加する。
# - 金利は「4.25% → 値4.25・unit pct」で固定（ratio 0.0425と混在させない）。
# - as_of_policy:
#     exchange_close … trading_date + close_time_local（timezone）→ UTC変換した確定時刻
#     day_end_utc    … 取引所単一クローズが定義できない系列（FX/先物継続/金利/暗号資産）。
#                      as_of = trading_date 23:59:59Z（「当日中のどこか」の明示的規約。
#                      個別値ごとの時刻捏造をしないための固定規約）
# - calendar は欠測サニティ検知（週末日付の検出等）のみに使う。**補完には使わない**
#   （休日・障害・未公表はMISSINGのまま。0・前日値・補間で埋めない）。
# - enabled: false は「identityのみ定義（収集しない）」。probe: true は
#   legacy実績のないprovider symbol（取得失敗はSOURCE GAPとして扱いエラーにしない）。

id: market_series_core
version: "1.1.0"
description: >-
  Market Data BankのCORE系列カタログ（series identity＋取得運用フィールド。
  Phase 2-D PART B / Phase 2-G official source gap closure）。
  series_idはmake_series_id規約から決定論導出される。
source: "監督者指示（P2-D/P2-G directive）＋legacy config.yaml stooq_symbols実績"
status: active
updated: "2026-08-30"
changelog: >-
  1.1.0（P2-G）: PRIMARY_OFFICIAL providers追加（treasury_gov / mof_japan /
  jquants）。UST2Y/UST10Yのofficial par yield系列を新設（既存^TNX系列とは
  概念が異なるため別series——NO SILENT MIXING）。JGB10Yを財務省国債金利情報へ、
  TOPIXをJ-Quants（JPX公式系API）へ接続。データ実績ゼロの旧UST2Y（市場実勢・
  Stooq経路）はidentity定義のみへ（enabled:false）。cross spreadはofficial par
  同士の組へ再定義（^TNX×official parの概念混合spreadは生成しない）。

# ---------------------------------------------------------------------------
# データ供給元の種別（PART C: 一次公表元とデータプロバイダを混同しない）
#   PRIMARY_OFFICIAL     … 取引所・中央銀行・統計局の公式公表値
#   MARKET_DATA_PROVIDER … 市場データ集約プロバイダ（本フェーズの取得元）
#   SECONDARY            … 報道等の二次値
# ---------------------------------------------------------------------------
providers:
  yfinance:
    source_type: MARKET_DATA_PROVIDER
    tier: 2
    endpoint_template: ""            # ライブラリ経由（yfinance）。生HTTPは扱わない
    response_format: library
    provider_normalized: true        # ライブラリ前処理済み（float供給。生CSVではない）
    notes: >-
      Yahoo Financeマーケットデータ（yfinance経由）。legacyの一次経路そのもの
      （src/collectors/market_data.py はyfinance一次・Stooq quoteフォールバックで
      本番Actionsから毎日実績）。ティッカーもlegacy config.yaml実績値。
      floatで供給される事実はfetchごとにprovider_float_transitとして申告される。
  stooq:
    source_type: MARKET_DATA_PROVIDER
    tier: 2
    endpoint_template: "https://stooq.com/q/d/l/?s={symbol}&i=d&d1={d1}&d2={d2}"
    response_format: csv          # Date,Open,High,Low,Close(,Volume)
    provider_normalized: false    # HTTP応答CSVをそのままraw保存できる（生値・非加工）
    notes: >-
      無料の市場データプロバイダ。取引所公式値ではない（PRIMARY_OFFICIALの
      日次公表値取込はSOURCE GAP G9系として将来トラック）。
      legacy実績: config.yaml stooq_symbols / src/collectors/market_data.py（quote endpoint）。
      **注意（P2-D live pilot実測）**: 日足historyエンドポイント（q/d/l/）はIP単位の
      ダウンロード制限があり、共有IP（GitHub Actionsランナー等）からはHTTP 200で
      HTML制限ページが返る。historyの一次経路にはyfinanceを使う。
  treasury_gov:
    source_type: PRIMARY_OFFICIAL
    tier: 1
    endpoint_template: "https://home.treasury.gov/resource-center/data-chart-center/interest-rates/daily-treasury-rates.csv/{year}/all?type=daily_treasury_yield_curve&field_tdr_date_value={year}&page&_format=csv"
    response_format: csv
    provider_normalized: false
    notes: >-
      米財務省 Daily Treasury Par Yield Curve Rates（公式公表値）。symbolは
      CSVの年限列名（"2 Yr"等）。par yield＝流通市場bid quotes（15:30 ET頃・
      NY連銀取得）から財務省が補間したconstant maturity。市場実勢利回りindex
      （^TNX等）・入札結果とは別概念。Tier1はsource種別であり
      「データが絶対に正しい」の保証ではない（既存原則維持）。
  mof_japan:
    source_type: PRIMARY_OFFICIAL
    tier: 1
    endpoint_template: "https://www.mof.go.jp/jgbs/reference/interest_rate/data/jgbcm_all.csv"
    response_format: csv
    provider_normalized: false
    notes: >-
      財務省 国債金利情報（公式公表値・Shift_JIS・和暦日付）。symbolはCSVの
      年限列名（"10年"等）。固定利付国債の流通市場価格ベースのconstant
      maturity・15時クローズ時点。入札平均利回り・特定銘柄利回りとは別概念。
  jquants:
    source_type: PRIMARY_OFFICIAL
    tier: 1
    endpoint_template: "https://api.jquants.com/v1/indices/topix"
    response_format: json
    provider_normalized: false
    notes: >-
      J-Quants（JPX子会社 JPX Market Innovation & Research 運営の公式データAPI）。
      /indices/topixはTOPIX指数値そのもの（ETF・先物ではない）。認証は
      環境変数からのruntime injectionのみ（JQUANTS_MAIL/JQUANTS_PASSWORD等）
      ——secretをGit/config/カタログへ保存しない。Freeプランは12週遅延・
      約2年分（当日値にはLight以上が必要——TOPIX_SOURCE_DECISION.md参照）。

defaults:
  frequency: daily
  adjustment: unadjusted
  preferred_source: stooq
  fallback_sources: []   # fallback発動時はsource-changed記録必須（silent switch禁止）

series:
  # ----- 株価指数（日本） -----
  - series_id: "index:nikkei225.close.closing.tokyo"
    display_name: "日経平均株価"
    asset_class: equity_index
    instrument_id: "index:nikkei225"
    metric: close
    observation_type: closing
    session: tokyo
    unit: index
    currency: ""
    timezone: "Asia/Tokyo"
    close_time_local: "15:30"     # 2024-11-05以降の東証現物クローズ
    as_of_policy: exchange_close
    calendar: weekdays
    provider_symbols: { stooq: "^nkx", yfinance: "^N225" }
    preferred_source: yfinance
    fallback_sources: [stooq]
    enabled: true
    role: CORE
    identity_notes: "指数現物終値。ETF(1321等)・日経225先物とは別系列"

  - series_id: "index:topix.close.closing.tokyo"
    display_name: "TOPIX"
    asset_class: equity_index
    instrument_id: "index:topix"
    metric: close
    observation_type: closing
    session: tokyo
    unit: index
    currency: ""
    timezone: "Asia/Tokyo"
    close_time_local: "15:30"
    as_of_policy: exchange_close
    calendar: weekdays
    provider_symbols: { jquants: "topix", stooq: "^tpx" }
    preferred_source: jquants
    fallback_sources: []          # official経路のみ（stooq symbolは記録として残すがchainに入れない）
    probe: true                   # J-Quants credential未投入のためlive未実証（実証後にfalse化）
    enabled: true
    role: CORE
    identity_notes: >-
      TOPIX指数現物終値（P2-G: J-Quants=JPX公式系APIの/indices/topix値。
      **TOPIX ≠ 1306.T等ETF ≠ TOPIX先物**——ETF/先物を指数seriesへ流用しない）。
      credentialは環境変数runtime injectionのみ。未設定・取得不能なら
