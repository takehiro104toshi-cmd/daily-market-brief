# ---------------------------------------------------------------------------
# 派生系列の基盤（PART F: foundation only——TAライブラリ化はしない）
# per_series: 各base seriesへ適用する汎用派生。series_idはbaseから決定論導出
#   （instrument・session維持・metric置換・observation_type=derived_metric）。
# cross_series: 複数seriesを入力とする派生（入力series_idを明示）。
# ---------------------------------------------------------------------------
derivations:
  per_series:
    - { metric: return_1d,  calculation: "return_1d:1.0.0",  unit: pct }
    - { metric: return_5d,  calculation: "return_5d:1.0.0",  unit: pct }
    - { metric: ma25,       calculation: "ma25:1.0.0",       unit: same_as_base }
    - { metric: dist_25dma, calculation: "dist_25dma:1.0.0", unit: pct }
  cross_series:
    # P2-G: spreadはofficial par同士で計算する（概念整合）。^TNX（市場実勢index）×
    # official parの混合spreadは生成しない。旧定義（UST10Y×UST2Y・実データゼロで
    # 一度も生成されず）はこの概念整合形へ置換。
    - series_id: "rates:UST10Y_par_UST2Y_par.spread.derived_metric"
      display_name: "米10年-2年金利差（official par yield）"
      inputs:
        - "rates:UST10Y_par.yield.closing.us"
        - "rates:UST2Y_par.yield.closing.us"
      calculation: "yield_spread:1.0.0"
      unit: pct_point
    - series_id: "index:nikkei225_topix.nt_ratio.derived_metric"
      display_name: "NT倍率"
      inputs:
        - "index:nikkei225.close.closing.tokyo"
        - "index:topix.close.closing.tokyo"
      calculation: "nt_ratio:1.0.0"
      unit: x

# ---------------------------------------------------------------------------
# 市場内部指標（market internals）: P2-Dではschema/catalog準備のみ（収集しない）。
# 騰落銘柄数・新高値新安値等はPRIMARY_OFFICIAL経路の確保が前提（SOURCE GAP扱い）。
# ---------------------------------------------------------------------------
internals_placeholder:
  - instrument_id: "internals:tse_prime_advance_decline"
    metric: advancers
    status: "not_collected（供給元未確保。identityの予約のみ）"
