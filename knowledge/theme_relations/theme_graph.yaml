# テーマ間の因果関係グラフ。Stage 1で旧config.yaml `theme_relations` からCOPY+NORMALIZE。
# 単純な業種分類ではなく、投資テーマとしての経済的な因果関係
# （例: 自動車→EV→蓄電池→半導体→AI、金利→金融→為替）を優先して対応付ける（旧config注記を踏襲）。
# Phase 6 Theme Map の初期グラフ。エッジは無向的な「資金・因果の隣接」を表す
# （方向・重み付けはPhase 6で拡張する。Stage 1では旧データの忠実コピー）。

id: theme_relations.theme_graph
version: "1.0.0"
description: "テーマ間の隣接関係（Theme Map初期グラフ）。キー=テーマ、値=関連テーマのリスト"
source: "config.yaml `theme_relations` より移設。Compass DNA THEME_DISCOVERY_RULES.md §3の連鎖マップと相互補完"
status: active

# themes.yaml に定義が無いがグラフにのみ登場するノード（旧configからの忠実コピーに伴う
# 未定義ラベル。Phase 2 entity resolver / Phase 6 で正式定義するまでの補助ノード）
supplementary_nodes:
  - "クラウド"
  - "SaaS"
  - "スマートフォン"
  - "決済"
  - "旅行"
  - "住宅"
  - "建設"
  - "インバウンド"

