# テーマ定義。Stage 1で旧config.yaml `macro_themes` / `durable_themes` からCOPY+NORMALIZE。
# keywords はニュース見出しの判定キーワード（旧Future Intelligence Engineの判定仕様を踏襲）。

id: theme_relations.themes
version: "1.1.0"
description: "投資テーマの定義（label＋判定キーワード）、長期継続テーマ、tank英語スラッグとの対応表"
source: "config.yaml `macro_themes`/`durable_themes` より移設。en_aliasesはarticle-intelligence-data-tankの実測テーマ語彙45種（2026-06-22..07-22の記事3,056件）との突合で作成（Stage 1.5）"
status: active

themes:
  - { label: "AI", keywords: ["AI", "生成AI", "人工知能"] }
  - { label: "半導体", keywords: ["半導体", "半導体製造装置"] }
  - { label: "電力", keywords: ["電力", "送配電", "発電"] }
  - { label: "GX", keywords: ["GX", "脱炭素", "カーボンニュートラル"] }
  - { label: "DX", keywords: ["DX", "デジタル化", "デジタルトランスフォーメーション"] }
  - { label: "防衛", keywords: ["防衛", "防衛費", "防衛装備"] }
  - { label: "宇宙", keywords: ["宇宙", "衛星", "ロケット"] }
  - { label: "量子", keywords: ["量子", "量子コンピュータ"] }
  - { label: "核融合", keywords: ["核融合", "フュージョン"] }
  - { label: "ロボット", keywords: ["ロボット", "自動化", "省人化"] }
  - { label: "医療", keywords: ["医療", "創薬", "医薬品"] }
  - { label: "バイオ", keywords: ["バイオ", "バイオテクノロジー"] }
  - { label: "サイバーセキュリティ", keywords: ["サイバーセキュリティ", "サイバー攻撃", "情報セキュリティ"] }
  - { label: "水インフラ", keywords: ["水インフラ", "上下水道", "水資源"] }
  - { label: "物流", keywords: ["物流", "倉庫", "配送"] }
  - { label: "資源", keywords: ["資源", "レアアース", "レアメタル"] }
  - { label: "食料", keywords: ["食料", "食料安全保障", "農業"] }
  - { label: "人口減少", keywords: ["人口減少", "少子化"] }
  - { label: "高齢化", keywords: ["高齢化", "介護"] }
  - { label: "自動運転", keywords: ["自動運転", "自動運転車"] }
  - { label: "自動車", keywords: ["自動車", "自動車販売", "新型車"] }
  - { label: "EV", keywords: ["EV", "電気自動車"] }
  - { label: "蓄電池", keywords: ["蓄電池", "バッテリー", "車載電池"] }
  - { label: "金融", keywords: ["金融", "銀行"] }
  - { label: "金利", keywords: ["金利", "利上げ", "利下げ"] }
  - { label: "為替", keywords: ["為替", "円安", "円高"] }
  - { label: "消費", keywords: ["消費", "個人消費"] }
  - { label: "人材", keywords: ["人材", "人材紹介", "採用市場"] }
  - { label: "広告", keywords: ["広告", "広告収益"] }

# tank記事コーパスの英語テーマスラッグ → 本ファイルのlabel（またはtheme_graphの
# supplementary_nodes）への対応表。曖昧なものは対応付けず unmapped_tank_slugs に残す
# （捏造マッピングをしない）。コモディティ系は暫定的に「資源」へ粗く集約（note参照）。
en_aliases:
  ai: "AI"
  semiconductor: "半導体"
  defense: "防衛"
  fx: "為替"
  electric_power: "電力"
  logistics: "物流"
  shipping: "物流"
  auto: "自動車"
  banking: "金融"
  insurance: "金融"
  monetary_policy: "金利"
  rates: "金利"
  biotech: "バイオ"
  cyber: "サイバーセキュリティ"
  consumption: "消費"
  retail: "消費"
  food: "食料"
  healthcare: "医療"
  space: "宇宙"
  rare_earth: "資源"
  oil: "資源"          # 粗い集約: エネルギー・コモディティの細分はPhase 6で再設計
  natural_gas: "資源"
  gold: "資源"
  copper: "資源"
  real_estate: "住宅"   # theme_graph supplementary_nodes の「住宅」

# 対応先が無い（現行テーマ体系の語彙ギャップ）tankスラッグ。Phase 6でテーマ新設を検討
# （特に地政学・通商/関税・インフレ・M&A・決算はCompass DNAでも頻出領域）
unmapped_tank_slugs:
  - chemicals
  - diplomacy_war
  - earnings
  - elections
  - employment
  - gdp
  - geopolitics
  - inflation
  - infrastructure
  - materials
  - mna
  - north_korea
  - regulation
  - sanctions
  - software
  - taiwan
  - tariffs
  - ukraine
  - us_china
  - us_iran_middle_east

# 長期継続テーマ（ニュース評価で継続性ボーナスの対象になるテーマ）
durable_themes:
  - "半導体"
  - "生成AI"
  - "AI"
  - "防衛"
  - "データセンター"
  - "資源"
  - "電力"
