# テーマ定義。Stage 1で旧config.yaml `macro_themes` / `durable_themes` からCOPY+NORMALIZE。
# keywords はニュース見出しの判定キーワード（旧Future Intelligence Engineの判定仕様を踏襲）。

id: theme_relations.themes
version: "1.0.0"
description: "投資テーマの定義（label＋判定キーワード）と、長期継続テーマ（durable）の一覧"
source: "config.yaml `macro_themes` および `durable_themes` より移設"
status: active

themes:
  - { label: "AI", keywords: ["AI", "生成AI", "人工知能"] }
  - { label: "半導体", keywords: ["半導体", "半導体製造装置"] }
  - { label: "電力", keywords: ["電力", "送配電", "発電"] }
  - { label: "GX", keywords: ["GX", "脱炭素", "カーボンニュートラル"] }
  - { label: "DX", keywords: ["DX", "デジタル化", "デジタルトランスフォーメーション"] }
  - { label: "防衛", keywords: ["防衛", "防衛費", "防衛装備"] }
  - { label: "宇宙", keywords: ["宇宙", "衛星", "ロケット"] }
  - { label: "量子", keywords: ["量子", "量子コンピュータ"] }
  - { label: "核融合", keywords: ["核融合", "フュージョン"] }
  - { label: "ロボット", keywords: ["ロボット", "自動化", "省人化"] }
  - { label: "医療", keywords: ["医療", "創薬", "医薬品"] }
  - { label: "バイオ", keywords: ["バイオ", "バイオテクノロジー"] }
