  - { label: "水インフラ", keywords: ["水インフラ", "上下水道", "水資源"] }
  - { label: "物流", keywords: ["物流", "倉庫", "配送"] }
  - { label: "資源", keywords: ["資源", "レアアース", "レアメタル"] }
  - { label: "食料", keywords: ["食料", "食料安全保障", "農業"] }
  - { label: "人口減少", keywords: ["人口減少", "少子化"] }
