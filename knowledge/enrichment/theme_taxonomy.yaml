                     "電力", "発電", "送配電", "power supply", "power demand",
                     "electric utility", "utilities"]
    weak_signals: ["power", "energy"]   # "power"単独タグ付けは禁止（テスト固定）
    exclude_terms: []

  - slug: grid
    ja_label: ""              # 既存catalogに単独labelなし（新設・電力の子）
