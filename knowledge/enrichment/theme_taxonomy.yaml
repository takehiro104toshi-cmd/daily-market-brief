# =============================================================================
# Theme Taxonomy（Phase 2-E / versioned knowledge asset・taxonomy foundation）
# =============================================================================
# 位置づけ:
# - 既存 knowledge/theme_relations/themes.yaml（v1.1.0・ja label 30種）を正本として
#   監査した上で、enrichment用に**安定slug**・**階層foundation**・**多信号マッチ規則**を
#   付与した分類語彙。既存ファイルは変更しない（ja_labelで対応付け）。
# - 本格Theme Graph（重み・方向）はPhase 6。ここではparent/child/relatedの表現まで。
#
# マッチ規則（THEME MATCHING安全則）:
# - strong_signals … 1つの出現でタグ付け可（テーマ固有性の高い語句）
# - weak_signals   … 単独では**絶対にタグ付けしない**（"power"だけでPower確定は禁止）。
#                    同一テーマのsignal（strong/weak問わず）が**2つ以上**共起した場合のみ
# - exclude_terms  … 共起した場合タグ付けを抑止（例: nuclear weapons→原子力発電テーマ抑止）
# - 大文字小文字: ASCII語は大文字小文字を区別しない（ただし"AI"等の全大文字略語は
#   大文字表記のみマッチ——一般語"ai"への誤爆防止）。日本語はそのまま部分一致。
#
# provenance: 本taxonomyによる分類は RULE_BASED / classifier=theme_rule_matcher。

id: enrichment_theme_taxonomy
version: "1.0.0"
description: >-
  記事分類用テーマ語彙（slug・階層・多信号マッチ規則・既存ja label対応・
  tank slug対応）。Phase 2-E taxonomy foundation。
source: >-
  knowledge/theme_relations/themes.yaml v1.1.0の監査＋監督者P2-E指示の現行重要テーマ
  （AI/Semiconductors/Data Center/Power/Grid/Nuclear/Defense/Robotics/
  Optical Communication/CPO/Critical Minerals/Shipbuilding/India/Space/
  Autonomous Driving/Finance/Pharma）＋tank歴史コーパスの語彙
status: active

themes:
  - slug: ai
    ja_label: "AI"            # theme_relations/themes.yaml対応
    tank_slugs: [ai]          # LegacyAnnotation比較用（ground truthではない）
    parent: null
    related: [semiconductors, data_center, robotics, quantum, cybersecurity]
    strong_signals: ["generative AI", "artificial intelligence", "生成AI", "人工知能",
                     "AI chip", "AI chips", "AI boom", "AI race", "AI model", "AI models",
                     "AI infrastructure", "AI spending", "AI demand", "AI startup",
                     "ChatGPT", "chatbot", "large language model", "LLM"]
    weak_signals: ["AI"]      # 単独では付けない（2信号目が必要）
    exclude_terms: []

  - slug: semiconductors
    ja_label: "半導体"
    tank_slugs: [semiconductor]
    parent: null
    related: [ai, data_center, critical_minerals]
