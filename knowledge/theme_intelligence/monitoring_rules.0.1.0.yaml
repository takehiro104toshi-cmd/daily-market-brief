# P6-B6C — monitoring ruleset（VERSIONED KNOWLEDGE）
#
# これは evaluator を programming する DSL ではない。condition ごとの評価器は
# src/intelligence/theme_intelligence/monitoring_engine.py に bounded に実装されており、
# 本 file が持てるのは「どの condition を有効にするか」「B6 が所有する閾値定数」「表示 key」だけである。
#
# 禁止（loader が schema で拒否する）: expression / python / eval / regex / prompt / model /
# weight / score / priority / probability / severity / rank / confidence / stance / target_price。
