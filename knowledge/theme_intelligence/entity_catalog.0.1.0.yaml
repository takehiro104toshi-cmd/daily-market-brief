# =============================================================================
# Entity catalog — versioned knowledge snapshot（Phase 6 / P6-B4B）
# =============================================================================
# - VERSIONED KNOWLEDGE であり authority ではない。公開後は不変。変更は次 version の別 file。
# - entity_id は "<kind>:<immutable-slug>"。kind は Foundation ThemeEntityKind の値（9 種のみ）。slug は公開後 rename しない。
# - ticker は identifier であって identity ではない。identifier は型付き（TICKER / INSTRUMENT_ID / ISO_COUNTRY / ISO_CURRENCY）。
# - aliases_safe は catalog 全体で一意（単独で解決可）。aliases_context は context_terms の共起が無ければ解決しない。
# - valid_from / valid_to は世界時間の存在期間（開始含む・終了含まない）。retired_in_version は catalog 上の retire。
# - 内容方針: 公開標準（ISO code・公開指数）と検証専用の架空 record（MVP_FIXTURE）のみ。顧客 watchlist 由来の企業集合・
#   人物・Compass 由来の文章は含めない。"Example ..." の company は実在しない。
